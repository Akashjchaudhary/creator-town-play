<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- added to a phone's home screen, it opens without the browser's bars -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1423" />
    <meta name="apple-mobile-web-app-title" content="Creator Town" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- a test build: keep it out of search engines -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Creator Town</title>
    <link rel="icon" href="icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      /* nothing on the page scrolls, zooms or gets selected: every touch belongs to the game */
      html, body { margin: 0; padding: 0; background: #1a1423; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      body { position: fixed; inset: 0; }
      /* keep clear of a phone's notch and home bar */
      #game { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); } /* Phaser centres the canvas inside this box itself */
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
      .font-preload { position: absolute; left: -9999px; font-family: 'Pixelify Sans'; }
      /* the game is wide: a phone held upright is asked to turn */
      #turn { display: none; position: fixed; inset: 0; z-index: 10; background: #1a1423; color: #f5f0e6; font: 500 22px/1.5 'Fredoka', system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; padding: 32px; }
      #turn b { display: block; color: #ffd75e; font-size: 30px; margin-bottom: 8px; }
      @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
    </style>
    <script type="module" crossorigin src="./assets/index-Bfop5J_r.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="turn"><div><b>Turn your phone sideways</b>Creator Town is played wide.</div></div>
    <span class="font-preload">preload</span>
    <span class="font-preload" style="font-family: 'Fredoka'; font-weight: 500">preload</span>
  </body>
</html>
